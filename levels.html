<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Level - Photoshop Skill Quest</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background-image: url('image/bg-game.svg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; font-family: 'Anuphan', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; width: 100vw; overflow: hidden; 
        }

        /* โปรไฟล์ผู้เล่นมุมขวาบน */
        .top-bar { position: absolute; top: 25px; right: 40px; z-index: 10; }
        .player-profile { background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(49, 168, 255, 0.4); padding: 5px 20px; border-radius: 30px; display: flex; align-items: center; gap: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5); transition: all 0.3s ease; }
        .player-profile:hover { border-color: #31a8ff; box-shadow: 0 5px 25px rgba(49, 168, 255, 0.6); transform: translateY(-3px); }
        .player-profile .avatar { background: linear-gradient(135deg, #31a8ff, #00ffff); color: #111; width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; box-shadow: 0 0 10px rgba(49, 168, 255, 0.5); font-weight: bold; }
        .player-profile .info { display: flex; flex-direction: column; text-align: left; line-height: 1.2; }
        .player-profile .name { font-size: 15px; font-weight: bold; color: #ffffff; }
        .player-profile .room { font-size: 12px; color: #00ffff; }

        /* การ์ดด่าน */
        .levels-wrapper { width: 90%; max-width: 1600px; display: flex; justify-content: center; align-items: center; gap: 3vw; margin: auto; height: 75vh; }
        .level-card { background-color: #111; flex: 1; height: 100%; max-height: 70vh; aspect-ratio: 4 / 7; padding: 0; border-radius: 25px; text-decoration: none; color: white; transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; justify-content: center; align-items: center; box-sizing: border-box; border: 2px solid rgba(255, 255, 255, 0.15); position: relative; overflow: hidden; }
        .level-cover { width: 100%; height: 100%; object-fit: cover; display: block; }

        .level-card.unlocked { border: 2px solid rgba(49, 168, 255, 0.4); cursor: pointer; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
        .level-card.unlocked::before { content: ''; position: absolute; top: 0; left: -150%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent); transform: skewX(-25deg); transition: left 0.8s ease-in-out; z-index: 10; pointer-events: none; }
        .level-card.unlocked:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 20px 50px rgba(49, 168, 255, 0.6), 0 0 25px rgba(0, 255, 255, 0.4); border-color: #00ffff; }
        .level-card.unlocked:hover::before { left: 150%; }
        .level-card.unlocked:active { transform: translateY(-2px) scale(0.98); box-shadow: 0 5px 15px rgba(49, 168, 255, 0.4); border-color: #31a8ff; }

        .level-card.locked { cursor: not-allowed; border-color: rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
        .level-card.locked .level-cover { filter: brightness(0.35) grayscale(0.2); }
        .lock-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; opacity: 0.95; z-index: 2; text-shadow: 0 5px 25px rgba(0, 0, 0, 1); }
    </style>
</head>
<body>

    <!-- โปรไฟล์ด้านขวาบน -->
    <div class="top-bar">
        <div class="player-profile">
            <div class="avatar">🎮</div>
            <div class="info">
                <span class="name" id="display_name">ผู้เล่น</span>
                <span class="room" id="display_room"></span>
            </div>
        </div>
    </div>

    <!-- ส่วนเลือกด่าน -->
    <div class="levels-wrapper">
        
        <!-- ด่าน 1: เปิดให้เล่นเสมอ -->
        <a href="stage1.html" class="level-card unlocked">
            <img src="image/stage1.svg" class="level-cover" alt="Stage 1" onerror="this.style.opacity='0'">
        </a>

        <!-- ด่าน 2 -->
        <a href="stage2.html" class="level-card locked" id="card_stage2">
            <img src="image/stage2.svg" class="level-cover" alt="Stage 2" onerror="this.style.opacity='0'">
            <span class="lock-icon" id="lock_stage2">🔒</span>
        </a>

        <!-- ด่าน 3 -->
        <a href="stage3.html" class="level-card locked" id="card_stage3">
            <img src="image/stage3.svg" class="level-cover" alt="Stage 3" onerror="this.style.opacity='0'">
            <span class="lock-icon" id="lock_stage3">🔒</span>
        </a>

        <!-- ด่าน 4 -->
        <a href="stage4.html" class="level-card locked" id="card_stage4"> 
            <img src="image/stage4.svg" class="level-cover" alt="Stage 4" onerror="this.style.opacity='0'">
            <span class="lock-icon" id="lock_stage4">🔒</span>
        </a>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const playerName = localStorage.getItem("player_name");
            const roomText = localStorage.getItem("room_text");

            if (!playerName) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("display_name").textContent = playerName;
            document.getElementById("display_room").textContent = roomText || "";

            const stage1Passed = localStorage.getItem("stage1_passed") === "true";
            const stage2Passed = localStorage.getItem("stage2_passed") === "true";
            const stage3Passed = localStorage.getItem("stage3_passed") === "true";

            function unlockStage(cardId, lockId) {
                const card = document.getElementById(cardId);
                const lock = document.getElementById(lockId);
                
                card.classList.remove("locked");
                card.classList.add("unlocked");
                
                if (lock) {
                    lock.style.display = "none";
                }
            }

            function lockStageLink(cardId) {
                const card = document.getElementById(cardId);
                card.addEventListener('click', function(e) {
                    if (card.classList.contains("locked")) {
                        e.preventDefault();
                    }
                });
            }

            lockStageLink("card_stage2");
            lockStageLink("card_stage3");
            lockStageLink("card_stage4");

            if (stage1Passed) {
                unlockStage("card_stage2", "lock_stage2");
            }
            if (stage2Passed) {
                unlockStage("card_stage3", "lock_stage3");
            }
            if (stage3Passed) {
                unlockStage("card_stage4", "lock_stage4");
            }
        });
    </script>
</body>
</html>
