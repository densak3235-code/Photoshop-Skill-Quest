<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิธีการเล่น - Photoshop Skill Quest</title>
    <style>
        /* --- Reset & Font --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Chakra Petch', sans-serif;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap');

        body {
            /* --- พื้นหลังใช้ไฟล์เดิม --- */
            background-image: url('image/bg-rules.svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: white;
            padding: 20px 0; /* เพิ่มพื้นที่แนวตั้งกันปุ่มล้นหน้าจอ */
        }

        /* --- Container หลัก ปรับให้ใหญ่ขึ้น --- */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* เพิ่มระยะห่างระหว่างรูปกับปุ่ม */
            width: 95%;
            max-width: 1100px; /* ขยายภาพให้ใหญ่กว่าเดิมมาก */
        }

        /* =========================================
           เอฟเฟกต์ "เส้นแสงสีฟ้าวิ่งรอบขอบ"
           ========================================= */
        .rules-card-container {
            position: relative;
            width: 100%;
            padding: 4px; /* ความหนาของเส้นแสงสีฟ้า */
            border-radius: 20px; /* ขอบมน */
            background: rgba(0, 0, 10, 0.4); /* สีพื้นหลังเผื่อรูปใส */
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); /* แสงฟุ้งกระจายรอบกล่อง */
            overflow: hidden;
        }

        /* เส้นแสงเลเซอร์ที่ 1 */
        .rules-card-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250%; /* ใหญ่พอที่จะครอบคลุมเวลาหมุน */
            height: 250%;
            /* สร้างเส้นแสงสีฟ้า (หางยาวๆ หัวสว่างๆ) */
            background: conic-gradient(from 0deg, transparent 70%, rgba(0, 243, 255, 0.8) 95%, #ffffff 100%);
            transform: translate(-50%, -50%);
            animation: beamRotate 4s linear infinite;
            z-index: 1;
        }

        /* เส้นแสงเลเซอร์ที่ 2 (วิ่งฝั่งตรงข้าม) */
        .rules-card-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250%;
            height: 250%;
            /* เริ่มทิศทางตรงข้าม 180 องศา */
            background: conic-gradient(from 180deg, transparent 70%, rgba(0, 243, 255, 0.8) 95%, #ffffff 100%);
            transform: translate(-50%, -50%);
            animation: beamRotate 4s linear infinite;
            z-index: 1;
        }

        @keyframes beamRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* กล่องเนื้อหาด้านใน (ทับแสงไว้ให้โผล่แค่ขอบ) */
        .card-content-bg {
            position: relative;
            background-color: #0b101a; /* สีพื้นหลังที่รูปวางทับ (โทนน้ำเงินเข้มจัด) */
            border-radius: 16px;
            padding: 5px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* รูปวิธีการเล่น */
        .rules-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        /* =========================================
           ปุ่มสีเขียว "ว้าวๆ" (Neon Glow & Pulse Effect)
           ========================================= */
        .btn-wow {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 18px 60px;
            font-size: 2rem; /* ตัวหนังสือใหญ่ขึ้น */
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 50px;
            z-index: 10;
            
            /* พื้นหลังปุ่มไล่สีเขียว-ฟ้า */
            background: linear-gradient(90deg, #00ff87, #60efff, #00ff87);
            background-size: 200% auto; /* ขยายขนาดพื้นหลังให้ทำอนิเมชั่นได้ */
            animation: gradientMove 3s linear infinite; /* ให้สีไหลไปเรื่อยๆ */
            
            /* เงาสะท้อนในปุ่มให้ดูนูน */
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.5), 
                        0 0 20px rgba(0, 255, 135, 0.6);
            transition: all 0.3s ease;
        }

        /* ออร่าแสงฟุ้งรอบปุ่ม (Glow Effect) */
        .btn-wow::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(90deg, #00ff87, #60efff, #00ff87);
            background-size: 200% auto;
            border-radius: 50px;
            z-index: -1;
            filter: blur(15px); /* ทำให้เบลอเป็นออร่า */
            opacity: 0.8;
            animation: gradientMove 3s linear infinite;
            transition: opacity 0.3s ease;
        }

        .btn-wow span {
            position: relative;
            z-index: 1;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.4);
        }

        /* เมื่อเอาเมาส์ชี้ปุ่ม */
        .btn-wow:hover {
            transform: scale(1.1) translateY(-5px); /* ขยายและลอยขึ้น */
            color: #ffffff;
        }

        /* ทำให้แสงฟุ้งสว่างขึ้นตอน Hover */
        .btn-wow:hover::before {
            opacity: 1;
            filter: blur(25px);
        }

        /* อนิเมชั่นสีวิ่งในปุ่ม */
        @keyframes gradientMove {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* ปรับสำหรับจอมือถือ */
        @media (max-width: 768px) {
            .btn-wow {
                font-size: 1.5rem;
                padding: 15px 40px;
            }
            .rules-card-container {
                padding: 3px;
                border-radius: 12px;
            }
            .card-content-bg {
                border-radius: 9px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- กรอบรูปภาพที่มีแสงสีฟ้าวิ่งรอบขอบ (Blue Light Beam) -->
        <div class="rules-card-container">
            <div class="card-content-bg">
                <img src="image/rules-ps.svg" alt="วิธีการเล่น Photoshop Skill Quest" class="rules-image">
            </div>
        </div>

        <!-- ปุ่มแบบว้าวๆ เรืองแสง -->
        <a href="levels.html" class="btn-wow">
            <span>เลือกด่าน</span>
        </a>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const player = localStorage.getItem("player_name");
            const room = localStorage.getItem("room");

            // หากไม่มีข้อมูลจากหน้า login ให้เด้งกลับไปที่ login.html
            if (!player || !room) {
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
